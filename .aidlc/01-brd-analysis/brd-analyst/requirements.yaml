requirements:
  # ---------------------------------------------------------------
  # ROLES
  # ---------------------------------------------------------------
  - id: ROLE-001
    type: role
    statement: "Platform Operator (Super Administrator) — onboards and maintains institutions, manages subscriptions, operates across all tenants."
    priority: must
    priority_source: confirmed
    source: "BRD 'Users and Stakeholders', §1"
    quote: "Platform Operator (Super Administrator) — onboards and maintains institutions, manages subscriptions"
    status: active

  - id: ROLE-002
    type: role
    statement: "Administrator — owns institution configuration, master data, staff/student records, class structure and reporting."
    priority: must
    priority_source: confirmed
    source: "BRD 'Users and Stakeholders'"
    quote: "School Administrator / Principal / School In-charge — owns the institution's configuration"
    status: active

  - id: ROLE-003
    type: role
    statement: "Principal — institution leadership role, same permission set as Administrator/School In-charge."
    priority: must
    priority_source: confirmed
    source: "BRD §2 'Permission model'"
    quote: "Administrator, Principal and School In-charge may create, amend and remove students, teachers, classes"
    status: active

  - id: ROLE-004
    type: role
    statement: "School In-charge — institution leadership role, same permission set as Administrator/Principal."
    priority: must
    priority_source: confirmed
    source: "BRD §2 'Permission model'"
    quote: "Administrator, Principal and School In-charge may create, amend and remove students, teachers, classes"
    status: active

  - id: ROLE-005
    type: role
    statement: "Teacher — records daily attendance, views assigned classes/rosters, publishes announcements, participates in meetings."
    priority: must
    priority_source: confirmed
    source: "BRD 'Users and Stakeholders'"
    quote: "Teacher — records daily attendance, views assigned classes and student rosters"
    status: active

  - id: ROLE-006
    type: role
    statement: "Student — accesses attendance records, class timetable, examination schedules, announcements, own academic reports."
    priority: must
    priority_source: confirmed
    source: "Q-C1"
    quote: "Student and Parent access is limited to: attendance records, class timetable, examination schedules, school announcements, and academic reports"
    status: active

  - id: ROLE-007
    type: role
    statement: "Parent / Guardian — accesses the same information categories as Student, limited to linked children."
    priority: must
    priority_source: confirmed
    source: "Q-C1"
    quote: "Student and Parent access is limited to: attendance records, class timetable, examination schedules, school announcements, and academic reports"
    status: active

  # ---------------------------------------------------------------
  # ENTITIES (business view)
  # ---------------------------------------------------------------
  - id: ENT-001
    type: entity
    statement: "Institution — the top-level subscribing school/tenant."
    priority: must
    priority_source: confirmed
    source: "BRD §1"
    quote: "Register an institution with its official registration number, name, contact details"
    status: active

  - id: ENT-002
    type: entity
    statement: "User Account — a signed-in identity bound to exactly one institution and role."
    priority: must
    priority_source: confirmed
    source: "BRD §2"
    quote: "Every user account is bound to exactly one institution at registration"
    status: active

  - id: ENT-003
    type: entity
    statement: "Student — an enrolled learner and their identity/demographic record."
    priority: must
    priority_source: confirmed
    source: "BRD §3"
    quote: "Enrol a student with school register number, roll number, name, date of birth"
    status: active

  - id: ENT-004
    type: entity
    statement: "Guardian (Parent) — the parent/guardian contact, and where linked, account, associated with a student."
    priority: must
    priority_source: confirmed
    source: "BRD §3"
    quote: "Record parent/guardian details — father's name, mother's name, contact email and telephone"
    status: active

  - id: ENT-005
    type: entity
    statement: "Teacher — a member of teaching staff and their assignments."
    priority: must
    priority_source: confirmed
    source: "BRD §4"
    quote: "Register a teacher with name, contact email, telephone, gender, address and joining date"
    status: active

  - id: ENT-006
    type: entity
    statement: "Class (Section) — a named, sectioned group of students with one class teacher."
    priority: must
    priority_source: confirmed
    source: "BRD §5"
    quote: "Create classes with a class name and section identifier"
    status: active

  - id: ENT-007
    type: entity
    statement: "Subject — an academic subject in the institution's catalogue, mapped to teachers and classes."
    priority: must
    priority_source: confirmed
    source: "BRD §5"
    quote: "Maintain the institution's subject catalogue"
    status: active

  - id: ENT-008
    type: entity
    statement: "Attendance Record — one outcome for one person on one date."
    priority: must
    priority_source: confirmed
    source: "BRD §6"
    quote: "Attendance is recorded against a specific person and a specific calendar date"
    status: active

  - id: ENT-009
    type: entity
    statement: "Announcement — a published institutional notice with author, content and effective date."
    priority: must
    priority_source: confirmed
    source: "BRD §7"
    quote: "Create an announcement with a title, detailed content and an effective date"
    status: active

  - id: ENT-010
    type: entity
    statement: "Collaboration Room — a named, passcode-gated space for messaging and meetings."
    priority: must
    priority_source: confirmed
    source: "BRD §8"
    quote: "Create a named collaboration room with a description and an access passcode"
    status: active

  - id: ENT-011
    type: entity
    statement: "Message — a retained, attributable text message within a room."
    priority: must
    priority_source: confirmed
    source: "BRD §8"
    quote: "Message history is retained for the life of the room and remains attributable to its author"
    status: active

  - id: ENT-012
    type: entity
    statement: "Meeting — a live audio/video session associated with a room."
    priority: must
    priority_source: confirmed
    source: "BRD §8"
    quote: "Start or join a live audio/video meeting associated with a room"
    status: active

  - id: ENT-013
    type: entity
    statement: "Report — a generated snapshot covering attendance, performance or course activity."
    priority: must
    priority_source: confirmed
    source: "BRD §9"
    quote: "Generate standard reports covering class attendance, student performance, course analytics"
    status: active

  - id: ENT-014
    type: entity
    statement: "Timetable / Period — a scheduled class, subject, room and teacher for a day/time slot."
    priority: must
    priority_source: confirmed
    source: "BRD §10"
    quote: "Maintain a weekly timetable of periods by day and time slot"
    status: active

  - id: ENT-015
    type: entity
    statement: "Subscription Plan — a commercial tier defining capacity, storage, support and capability entitlements."
    priority: must
    priority_source: confirmed
    source: "BRD §12"
    quote: "Each tier defines the institution's learner capacity, storage allowance, support level"
    status: active

  - id: ENT-016
    type: entity
    statement: "Institution Configuration — institution-level academic, notification and access settings."
    priority: must
    priority_source: confirmed
    source: "BRD §11"
    quote: "Maintain general institution settings including academic year, time zone and language preference"
    status: active

  - id: ENT-017
    type: entity
    statement: "Academic Year / Term — the academic-year and term/semester structure a rollover operates against."
    priority: must
    priority_source: confirmed
    source: "Q-H1"
    quote: "Academic Year → Term/Semester hierarchy as proposed"
    status: active

  # ---------------------------------------------------------------
  # FUNCTIONAL — 6.1 Institution Management
  # ---------------------------------------------------------------
  - id: FR-001
    type: functional
    statement: "The Platform Operator can register an institution with its official registration number, name, contact details and full postal address."
    priority: must
    priority_source: confirmed
    source: "BRD §1"
    quote: "Register an institution with its official registration number, name, contact details and full postal address."
    status: active
    owner_role: ROLE-001

  - id: FR-002
    type: functional
    statement: "An Institution Administrator can maintain and update their own institution's details."
    priority: must
    priority_source: confirmed
    source: "BRD §1"
    quote: "Institution administrators may update their own institution's details."
    status: active
    owner_role: ROLE-002

  - id: FR-003
    type: functional
    statement: "The Platform Operator can assign, view and change an institution's subscription plan and subscription start date."
    priority: must
    priority_source: confirmed
    source: "BRD §1"
    quote: "Assign, view and change the institution's subscription plan and subscription start date."
    status: active
    owner_role: ROLE-001

  - id: FR-004
    type: functional
    statement: "The Platform Operator can withdraw an institution from active service while preserving its historical record."
    priority: must
    priority_source: confirmed
    source: "BRD §1"
    quote: "Withdraw an institution from active service while preserving its historical record."
    status: active
    owner_role: ROLE-001

  - id: FR-005
    type: functional
    statement: "The platform provides a searchable public directory of institutions, exposing institution name and city/region only, to support user self-registration."
    priority: must
    priority_source: confirmed
    source: "Q-H7"
    quote: "The public institution directory exposes institution name and city/region only"
    status: active

  - id: BR-001
    type: business_rule
    statement: "Only the Platform Operator may create or withdraw an institution."
    priority: must
    priority_source: confirmed
    source: "BRD §1"
    quote: "Only the Platform Operator may create or withdraw an institution."
    status: active

  - id: BR-002
    type: business_rule
    statement: "Institution administrators may update their own institution's details."
    priority: must
    priority_source: confirmed
    source: "BRD §1"
    quote: "Institution administrators may update their own institution's details."
    status: active

  - id: BR-003
    type: business_rule
    statement: "A new institution registration is rejected as a duplicate only when name, contact email and postal code all match an existing institution."
    priority: must
    priority_source: confirmed
    source: "Q-M1"
    quote: "All three fields (name, contact email, postal code) must match an existing institution for a new registration to be rejected"
    status: active

  - id: BR-004
    type: business_rule
    statement: "Contact email must be valid, telephone must be a valid contact number, and postal code must be a valid six-digit value."
    priority: must
    priority_source: confirmed
    source: "BRD §1"
    quote: "Contact email must be valid, telephone must be a valid contact number, and postal code must be a valid six-digit value."
    status: active

  - id: BR-005
    type: business_rule
    statement: "Institution withdrawal is a reversible deactivation; institutional records are retained and excluded from active operation, never destroyed."
    priority: must
    priority_source: confirmed
    source: "BRD §1"
    quote: "Withdrawal is a reversible deactivation; institutional records are retained and excluded from active operation, never destroyed."
    status: active

  - id: BR-006
    type: business_rule
    statement: "Every other business record in the platform belongs to exactly one institution."
    priority: must
    priority_source: confirmed
    source: "BRD §1"
    quote: "Every other business record in the platform belongs to exactly one institution."
    status: active

  # ---------------------------------------------------------------
  # FUNCTIONAL — 6.2 Identity, Access and Security
  # ---------------------------------------------------------------
  - id: FR-006
    type: functional
    statement: "A prospective user can self-register a user account against a chosen institution and role, and is granted immediate access with no additional approval step."
    priority: must
    priority_source: confirmed
    source: "Q-H6"
    quote: "Self-registration grants immediate access for all roles, as the BRD currently describes"
    status: active

  - id: FR-007
    type: functional
    statement: "A registered user can sign in, establish a session, and sign out."
    priority: must
    priority_source: confirmed
    source: "BRD §2"
    quote: "Sign-in, session establishment and sign-out."
    status: active

  - id: FR-008
    type: functional
    statement: "A signed-in user can retrieve their own identity, institution and roles."
    priority: must
    priority_source: confirmed
    source: "BRD §2"
    quote: "Retrieval of the signed-in user's identity, institution and roles."
    status: active

  - id: FR-009
    type: functional
    statement: "Every business function and navigation destination is authorised by the requesting user's role."
    priority: must
    priority_source: confirmed
    source: "BRD §2"
    quote: "Role-based authorisation of every business function and navigation destination."
    status: active

  - id: FR-010
    type: functional
    statement: "The platform informs a user clearly when they lack permission for an action they attempted."
    priority: must
    priority_source: confirmed
    source: "BRD §2"
    quote: "Denial handling that informs a user clearly when they lack permission."
    status: active

  - id: BR-007
    type: business_rule
    statement: "The supported roles are Platform Operator, Administrator, Principal, School In-charge, Teacher, Student and Parent."
    priority: must
    priority_source: confirmed
    source: "BRD §2"
    quote: "The supported roles are Platform Operator (Super Administrator), Administrator, Principal, School In-charge, Teacher, Student and Parent."
    status: active

  - id: BR-008
    type: business_rule
    statement: "Every user account is bound to exactly one institution at registration and inherits that institution's data boundary permanently."
    priority: must
    priority_source: confirmed
    source: "BRD §2"
    quote: "Every user account is bound to exactly one institution at registration and inherits that institution's data boundary permanently."
    status: active

  - id: BR-009
    type: business_rule
    statement: "All business data access is filtered by the requesting user's institution; cross-institution access is prohibited for all roles other than the Platform Operator."
    priority: must
    priority_source: confirmed
    source: "BRD §2"
    quote: "cross-institution access is prohibited for all roles other than the Platform Operator."
    status: active

  - id: BR-010
    type: business_rule
    statement: "Administrator, Principal and School In-charge may create, amend and remove students, teachers, classes, attendance and announcements within their institution."
    priority: must
    priority_source: confirmed
    source: "BRD §2"
    quote: "Administrator, Principal and School In-charge may create, amend and remove students, teachers, classes, attendance and announcements"
    status: active

  - id: BR-011
    type: business_rule
    statement: "Teachers may view students and classes, record and amend attendance, and publish announcements; they may not create, amend or remove student, teacher or class master records."
    priority: must
    priority_source: confirmed
    source: "BRD §2"
    quote: "Teachers may view students and classes, record and amend attendance, and publish announcements"
    status: active

  - id: BR-012
    type: business_rule
    statement: "Students and Parents have read access to announcements and their own relevant information, and may participate in collaboration rooms."
    priority: must
    priority_source: confirmed
    source: "BRD §2"
    quote: "Students and Parents have read access to announcements and their own relevant information"
    status: active

  - id: BR-013
    type: business_rule
    statement: "Only the Platform Operator may operate across institutions."
    priority: must
    priority_source: confirmed
    source: "BRD §2"
    quote: "Only the Platform Operator may operate across institutions."
    status: active

  - id: BR-014
    type: business_rule
    statement: "Passwords must meet the platform's minimum complexity policy; credentials are never displayed or transmitted in readable form."
    priority: must
    priority_source: confirmed
    source: "BRD §2"
    quote: "Passwords must meet the platform's minimum complexity policy"
    status: active
    note: "Complexity policy figure deferred to Tech Design (L1)."

  - id: BR-015
    type: business_rule
    statement: "Sessions expire after a defined period of validity and must be re-established by signing in again."
    priority: must
    priority_source: confirmed
    source: "BRD §2"
    quote: "Sessions expire after a defined period of validity"
    status: active
    note: "Expiry duration deferred to Tech Design (L2)."

  - id: BR-016
    type: business_rule
    statement: "Sign-out immediately terminates the session."
    priority: must
    priority_source: confirmed
    source: "BRD §2"
    quote: "Sign-out immediately terminates the session."
    status: active

  # ---------------------------------------------------------------
  # FUNCTIONAL — 6.3 Student Records Management
  # ---------------------------------------------------------------
  - id: FR-011
    type: functional
    statement: "Institution staff can enrol a student with school register number, roll number, name, date of birth, gender, contact email and class placement."
    priority: must
    priority_source: confirmed
    source: "BRD §3"
    quote: "Enrol a student with school register number, roll number, name, date of birth, gender, contact email and class placement."
    status: active
    owner_role: ROLE-002

  - id: FR-012
    type: functional
    statement: "Institution staff can record parent/guardian details against the student."
    priority: must
    priority_source: confirmed
    source: "BRD §3"
    quote: "Record parent/guardian details — father's name, mother's name, contact email and telephone — against the student."
    status: active

  - id: FR-013
    type: functional
    statement: "Institution staff can amend student details and change class placement."
    priority: must
    priority_source: confirmed
    source: "BRD §3"
    quote: "Amend student details and change class placement."
    status: active

  - id: FR-014
    type: functional
    statement: "Institution staff can withdraw a student record as a reversible deactivation; historical attendance and class-assignment records remain intact and attributable regardless of active/withdrawn status."
    priority: must
    priority_source: confirmed
    source: "Q-M2"
    quote: "Student withdrawal and Teacher removal are reversible deactivations, consistent with the Institution withdrawal model."
    status: active

  - id: FR-015
    type: functional
    statement: "Institution staff and Teachers can retrieve a student individually, as a full institutional list, or as a class roster."
    priority: must
    priority_source: confirmed
    source: "BRD §3"
    quote: "Retrieve a student individually, as a full institutional list, or as a class roster."
    status: active

  - id: FR-016
    type: functional
    statement: "Institution staff can optionally link a student record to a platform user account."
    priority: must
    priority_source: confirmed
    source: "BRD §3"
    quote: "Optionally link a student record to a platform user account."
    status: active

  - id: FR-017
    type: functional
    statement: "The BRD includes Parent and Student roles but does not define the parent-student association process. The implementation approach is outside the scope of the current BRD and will be determined during solution design."
    priority: must
    priority_source: confirmed
    source: "Q-C5 (revised)"
    quote: "The BRD includes Parent and Student roles but does not define the parent-student association process. The implementation approach is outside the scope of the current BRD and will be determined during solution design."
    status: deferred
    deferred_to: "Tech Design"
    note: "Revision of an earlier answer that specified a staff-initiated-at-enrolment mechanism; that specific business rule has been withdrawn. The Parent access capability itself (FR-075) remains committed — only the association mechanism is undefined here."

  - id: BR-017
    type: business_rule
    statement: "A student belongs to exactly one institution and is placed in exactly one class at any time."
    priority: must
    priority_source: confirmed
    source: "BRD §3"
    quote: "A student belongs to exactly one institution and is placed in exactly one class at any time."
    status: active

  - id: BR-018
    type: business_rule
    statement: "School register number and roll number must be unique within the institution."
    priority: must
    priority_source: confirmed
    source: "BRD §3"
    quote: "School register number and roll number must be unique within the institution."
    status: active

  - id: BR-019
    type: business_rule
    statement: "Every student must have a class placement before attendance can be recorded for them."
    priority: must
    priority_source: confirmed
    source: "BRD §3"
    quote: "Every student must have a class placement before attendance can be recorded for them."
    status: active

  - id: BR-020
    type: business_rule
    statement: "Student records are visible only to authorised staff of the same institution."
    priority: must
    priority_source: confirmed
    source: "BRD §3"
    quote: "Student records are visible only to authorised staff of the same institution."
    status: active

  - id: BR-021
    type: business_rule
    statement: "Guardian contact details are treated as sensitive personal data and follow the same access rules as the student record."
    priority: must
    priority_source: confirmed
    source: "BRD §3"
    quote: "Guardian contact details are treated as sensitive personal data and follow the same access rules as the student record."
    status: active

  # ---------------------------------------------------------------
  # FUNCTIONAL — 6.4 Teaching Staff Management
  # ---------------------------------------------------------------
  - id: FR-018
    type: functional
    statement: "Institution staff can register a teacher with name, contact email, telephone, gender, address and joining date."
    priority: must
    priority_source: confirmed
    source: "BRD §4"
    quote: "Register a teacher with name, contact email, telephone, gender, address and joining date."
    status: active

  - id: FR-019
    type: functional
    statement: "Institution staff can amend teacher details and remove a teacher from active service as a reversible deactivation; historical records remain intact regardless of active/removed status."
    priority: must
    priority_source: confirmed
    source: "Q-M2"
    quote: "Student withdrawal and Teacher removal are reversible deactivations, consistent with the Institution withdrawal model."
    status: active

  - id: FR-020
    type: functional
    statement: "Institution staff can retrieve a teacher individually or as a full institutional list."
    priority: must
    priority_source: confirmed
    source: "BRD §4"
    quote: "Retrieve a teacher individually or as a full institutional list."
    status: active

  - id: FR-021
    type: functional
    statement: "Institution staff can assign a teacher as class teacher of a class."
    priority: must
    priority_source: confirmed
    source: "BRD §4"
    quote: "Assign a teacher as class teacher of a class."
    status: active

  - id: FR-022
    type: functional
    statement: "Institution staff can assign a teacher to teach a given subject to a given class."
    priority: must
    priority_source: confirmed
    source: "BRD §4"
    quote: "Assign a teacher to teach a given subject to a given class."
    status: active

  - id: FR-023
    type: functional
    statement: "Institution staff can optionally link a teacher record to a platform user account."
    priority: must
    priority_source: confirmed
    source: "BRD §4"
    quote: "Optionally link a teacher record to a platform user account."
    status: active

  - id: BR-022
    type: business_rule
    statement: "A teacher belongs to exactly one institution."
    priority: must
    priority_source: confirmed
    source: "BRD §4"
    quote: "A teacher belongs to exactly one institution."
    status: active

  - id: BR-023
    type: business_rule
    statement: "A class may have at most one class teacher, and a teacher may be class teacher of at most one class."
    priority: must
    priority_source: confirmed
    source: "BRD §4"
    quote: "A class may have at most one class teacher, and a teacher may be class teacher of at most one class."
    status: active

  - id: BR-024
    type: business_rule
    statement: "A teacher may be assigned to multiple subject-and-class combinations."
    priority: must
    priority_source: confirmed
    source: "BRD §4"
    quote: "A teacher may be assigned to multiple subject-and-class combinations."
    status: active

  - id: BR-025
    type: business_rule
    statement: "Removing a teacher must not orphan class or attendance history; existing assignments must be reassigned or released first."
    priority: must
    priority_source: confirmed
    source: "BRD §4"
    quote: "Removing a teacher must not orphan class or attendance history; existing assignments must be reassigned or released first."
    status: active

  # ---------------------------------------------------------------
  # FUNCTIONAL — 6.5 Class, Section and Subject Management
  # ---------------------------------------------------------------
  - id: FR-024
    type: functional
    statement: "Institution staff can create classes with a class name and section identifier."
    priority: must
    priority_source: confirmed
    source: "BRD §5"
    quote: "Create classes with a class name and section identifier."
    status: active

  - id: FR-025
    type: functional
    statement: "Institution staff can amend and remove classes."
    priority: must
    priority_source: confirmed
    source: "BRD §5"
    quote: "Amend and remove classes."
    status: active

  - id: FR-026
    type: functional
    statement: "Institution staff can assign a class teacher to each class."
    priority: must
    priority_source: confirmed
    source: "BRD §5"
    quote: "Assign a class teacher to each class."
    status: active

  - id: FR-027
    type: functional
    statement: "Institution staff and Teachers can retrieve classes individually or as a full institutional list, with the assigned class teacher shown."
    priority: must
    priority_source: confirmed
    source: "BRD §5"
    quote: "Retrieve classes individually or as a full institutional list, with the assigned class teacher shown."
    status: active

  - id: FR-028
    type: functional
    statement: "Institution staff can maintain the institution's subject catalogue."
    priority: must
    priority_source: confirmed
    source: "BRD §5"
    quote: "Maintain the institution's subject catalogue."
    status: active

  - id: FR-029
    type: functional
    statement: "Institution staff can map subjects to teachers and classes."
    priority: must
    priority_source: confirmed
    source: "BRD §5"
    quote: "Map subjects to teachers and classes."
    status: active

  - id: BR-026
    type: business_rule
    statement: "The combination of class name and section must be unique within an institution."
    priority: must
    priority_source: confirmed
    source: "BRD §5"
    quote: "The combination of class name and section must be unique within an institution."
    status: active

  - id: BR-027
    type: business_rule
    statement: "A class belongs to exactly one institution."
    priority: must
    priority_source: confirmed
    source: "BRD §5"
    quote: "A class belongs to exactly one institution."
    status: active

  - id: BR-028
